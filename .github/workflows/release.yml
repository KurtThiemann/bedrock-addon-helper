name: Release

# Publishes to npm when a GitHub release is published. Authentication uses
# npm trusted publishing (OIDC), so no npm token is stored in the repository;
# npm adds a provenance statement for every published version.

on:
    release:
        types: [published]

permissions:
    contents: read
    id-token: write

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org
                  cache: npm
            # Trusted publishing needs npm 11.5.1 or newer.
            - run: npm install -g npm@latest
            - run: npm ci
            # The release tag is the version (v2.0.0 -> 2.0.0); package.json in the repo isn't updated.
            - name: Set the version from the release tag
              env:
                  TAG: ${{ github.event.release.tag_name }}
              run: |
                  version="${TAG#v}"
                  if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
                      echo "Release tag $TAG is not a version like v2.0.0 or v2.1.0-beta.1."
                      exit 1
                  fi
                  npm version "$version" --no-git-tag-version --allow-same-version
            - run: npm run lint
            - run: npm run typecheck
            - run: npm test
            # prepack builds dist/. Prerelease versions (e.g. 2.1.0-beta.1) go to the "next" tag.
            - name: Publish
              run: |
                  version="$(node -p 'require("./package.json").version')"
                  case "$version" in
                      *-*) npm publish --tag next ;;
                      *) npm publish ;;
                  esac
