name: Release

# Publishes to npm when a GitHub release is published. Authentication uses
# npm trusted publishing (OIDC), so no npm token is stored in the repository;
# npm adds a provenance statement for every published version.

on:
    release:
        types: [published]

permissions:
    contents: read
    id-token: write

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org
                  cache: npm
            # Trusted publishing needs npm 11.5.1 or newer.
            - run: npm install -g npm@latest
            - run: npm ci
            - name: Check that the release tag matches the package version
              env:
                  TAG: ${{ github.event.release.tag_name }}
              run: |
                  version="$(node -p 'require("./package.json").version')"
                  if [ "$TAG" != "v$version" ]; then
                      echo "Release tag $TAG does not match package.json version $version (expected v$version)."
                      exit 1
                  fi
            - run: npm run lint
            - run: npm run typecheck
            - run: npm test
            # prepack builds dist/. Prerelease versions (e.g. 2.1.0-beta.1) go to the "next" tag.
            - name: Publish
              run: |
                  version="$(node -p 'require("./package.json").version')"
                  case "$version" in
                      *-*) npm publish --tag next ;;
                      *) npm publish ;;
                  esac
